<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sklews">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=20260808">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png?v=20260808">

    <title>Sklews — Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=BUILD-20260808-icon">
    <style>
        .auth-form input {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        .auth-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }
        .auth-form input::placeholder { color: var(--muted); }
        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-logo-arena" id="auth-logo-arena" aria-hidden="true">
            <img class="logo-mark" id="auth-logo-ball" src="/static/icon-512.png?v=20260808" alt="" width="72" height="72">
        </div>
        <div class="logo">Sklews</div>
        <p class="auth-byline">prod by Skleo</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">Войти</button>
            <button type="button" class="auth-tab" id="tab-register">Создать</button>
        </div>

        <form method="POST" class="auth-form" id="authForm">
            <input type="hidden" name="action" id="form-action" value="login">
            <input type="text" name="username" placeholder="Логин" required autocomplete="username" autofocus>
            <div class="auth-pass-wrap">
            <input type="password" name="password" id="auth-password" placeholder="Пароль" required autocomplete="current-password">
            <button type="button" class="auth-pass-toggle" id="auth-pass-toggle" aria-label="Показать пароль"><i class="fa-solid fa-eye"></i></button>
        </div>
            <button type="submit" class="btn btn-primary full" id="submit-btn" style="margin-top:8px;width:100%">Войти</button>
        </form>
    </div>
    <script>
        const tabRegister = document.getElementById('tab-register');
        const tabLogin = document.getElementById('tab-login');
        const formAction = document.getElementById('form-action');
        const submitBtn = document.getElementById('submit-btn');
        function setMode(mode) {
            if (mode === 'register') {
                tabRegister.classList.add('active'); tabLogin.classList.remove('active');
                formAction.value = 'register'; submitBtn.textContent = 'Создать аккаунт';
            } else {
                tabLogin.classList.add('active'); tabRegister.classList.remove('active');
                formAction.value = 'login'; submitBtn.textContent = 'Войти';
            }
        }
        tabRegister.onclick = () => setMode('register');
        tabLogin.onclick = () => setMode('login');
    </script>

<script>
(function(){
  const ball = document.getElementById('auth-logo-ball');
  if (!ball) return;
  let x = 40, y = 40, vx = 1.6, vy = 1.3, flying = true, raf = 0;
  const size = 72;
  function placeHome(){
    // dock above logo title
    const logo = document.querySelector('.logo');
    if (logo) {
      const r = logo.getBoundingClientRect();
      x = Math.max(8, r.left + r.width/2 - size/2);
      y = Math.max(8, r.top - size - 18);
    } else {
      x = (window.innerWidth - size) / 2;
      y = 80;
    }
    ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
  }
  function frame(){
    if (!flying) return;
    const w = window.innerWidth, h = window.innerHeight;
    x += vx; y += vy;
    if (x <= 0) { x = 0; vx = Math.abs(vx); }
    if (x + size >= w) { x = w - size; vx = -Math.abs(vx); }
    if (y <= 0) { y = 0; vy = Math.abs(vy); }
    if (y + size >= h) { y = h - size; vy = -Math.abs(vy); }
    ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    raf = requestAnimationFrame(frame);
  }
  ball.style.left = '0';
  ball.style.top = '0';
  ball.style.cursor = 'pointer';
  ball.title = 'Нажми — остановить / запустить';
  x = Math.random() * Math.max(20, window.innerWidth - size - 20);
  y = Math.random() * Math.max(20, window.innerHeight * 0.4);
  raf = requestAnimationFrame(frame);
  ball.addEventListener('click', function(){
    flying = !flying;
    if (flying) {
      vx = (Math.random() > 0.5 ? 1 : -1) * (1.4 + Math.random());
      vy = (Math.random() > 0.5 ? 1 : -1) * (1.1 + Math.random());
      raf = requestAnimationFrame(frame);
    } else {
      cancelAnimationFrame(raf);
      placeHome();
    }
  });
})();
</script>

<style>
.auth-pass-wrap{position:relative;width:100%}
.auth-pass-wrap input{width:100%;padding-right:44px!important}
.auth-pass-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:16px}
</style>
<script>
(function(){
  try{
    var raw=localStorage.getItem('sklews_theme_vars');
    if(raw){
      var p=JSON.parse(raw), r=document.documentElement;
      if(p.bg){r.style.setProperty('--bg',p.bg);document.body.style.background=p.bg}
      if(p.card)r.style.setProperty('--card',p.card);
      if(p.text)r.style.setProperty('--text',p.text);
      if(p.muted)r.style.setProperty('--muted',p.muted);
      if(p.accent){r.style.setProperty('--accent',p.accent);var m=document.querySelector('meta[name=theme-color]');if(m)m.content=p.accent}
      if(p.border)r.style.setProperty('--border',p.border);
    }
  }catch(e){}
  var btn=document.getElementById('auth-pass-toggle'), inp=document.getElementById('auth-password');
  if(btn&&inp)btn.onclick=function(){
    var show=inp.type==='password';
    inp.type=show?'text':'password';
    btn.innerHTML=show?'<i class="fa-solid fa-eye-slash"></i>':'<i class="fa-solid fa-eye"></i>';
  };
})();
</script>
</body>
</html>
