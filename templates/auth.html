<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sklews — Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .auth-form input {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        .auth-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }
        .auth-form input::placeholder { color: var(--muted); }
        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="logo">Sklews</div>
        <p class="subtitle">Эксклюзивное пространство</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">Войти</button>
            <button type="button" class="auth-tab" id="tab-register">Создать</button>
        </div>

        <form method="POST" class="auth-form" id="authForm">
            <input type="hidden" name="action" id="form-action" value="login">
            <input type="text" name="username" placeholder="Логин" required autocomplete="username" autofocus>
            <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
            <button type="submit" class="btn btn-primary full" id="submit-btn" style="margin-top:8px;width:100%">Войти</button>
        </form>
    </div>
    <script>
        const tabRegister = document.getElementById('tab-register');
        const tabLogin = document.getElementById('tab-login');
        const formAction = document.getElementById('form-action');
        const submitBtn = document.getElementById('submit-btn');
        function setMode(mode) {
            if (mode === 'register') {
                tabRegister.classList.add('active'); tabLogin.classList.remove('active');
                formAction.value = 'register'; submitBtn.textContent = 'Создать аккаунт';
            } else {
                tabLogin.classList.add('active'); tabRegister.classList.remove('active');
                formAction.value = 'login'; submitBtn.textContent = 'Войти';
            }
        }
        tabRegister.onclick = () => setMode('register');
        tabLogin.onclick = () => setMode('login');
    </script>
</body>
</html>
