<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#8b5cf6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sklews">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v=7">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/apple-touch-icon.png?v=7">

    <title>Sklews BUILD-20260807-1500 — Вход</title>
    <link rel="stylesheet" href="/static/css/style.css?v=BUILD-20260807-1500">
    <style>
        .auth-form input {
            width: 100%;
            padding: 16px 18px;
            margin-bottom: 12px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        .auth-form input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }
        .auth-form input::placeholder { color: var(--muted); }
        .error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 14px;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-logo-arena" id="auth-logo-arena" aria-hidden="true">
            <img class="logo-mark" id="auth-logo-ball" src="/static/icon-512.png?v=7" alt="" width="72" height="72">
        </div>
        <div class="logo">Sklews</div>
        <p class="auth-build-mark" style="font-size:11px;color:#a78bfa;margin:0 0 8px">BUILD-20260807-1500</p>
        <p class="subtitle">Эксклюзивное пространство</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="tab-login">Войти</button>
            <button type="button" class="auth-tab" id="tab-register">Создать</button>
        </div>

        <form method="POST" class="auth-form" id="authForm">
            <input type="hidden" name="action" id="form-action" value="login">
            <input type="text" name="username" placeholder="Логин" required autocomplete="username" autofocus>
            <input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
            <button type="submit" class="btn btn-primary full" id="submit-btn" style="margin-top:8px;width:100%">Войти</button>
        </form>
    </div>
    <script>
        const tabRegister = document.getElementById('tab-register');
        const tabLogin = document.getElementById('tab-login');
        const formAction = document.getElementById('form-action');
        const submitBtn = document.getElementById('submit-btn');
        function setMode(mode) {
            if (mode === 'register') {
                tabRegister.classList.add('active'); tabLogin.classList.remove('active');
                formAction.value = 'register'; submitBtn.textContent = 'Создать аккаунт';
            } else {
                tabLogin.classList.add('active'); tabRegister.classList.remove('active');
                formAction.value = 'login'; submitBtn.textContent = 'Войти';
            }
        }
        tabRegister.onclick = () => setMode('register');
        tabLogin.onclick = () => setMode('login');
    </script>

<script>
(function(){
  const ball = document.getElementById('auth-logo-ball');
  if (!ball) return;
  let x = 40, y = 40, vx = 1.6, vy = 1.3;
  const size = 72;
  function frame(){
    const w = window.innerWidth, h = window.innerHeight;
    x += vx; y += vy;
    if (x <= 0) { x = 0; vx = Math.abs(vx); }
    if (x + size >= w) { x = w - size; vx = -Math.abs(vx); }
    if (y <= 0) { y = 0; vy = Math.abs(vy); }
    if (y + size >= h) { y = h - size; vy = -Math.abs(vy); }
    ball.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    requestAnimationFrame(frame);
  }
  ball.style.left = '0';
  ball.style.top = '0';
  x = Math.random() * Math.max(20, window.innerWidth - size - 20);
  y = Math.random() * Math.max(20, window.innerHeight * 0.4);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
